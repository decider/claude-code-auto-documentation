name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure git identity for hook tests
        run: |
          git config --global user.email "ci@test"
          git config --global user.name "ci"
      - name: Run all tests
        run: npm test
